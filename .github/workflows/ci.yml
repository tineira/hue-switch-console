name: CI

# Checks every pull request and every push to main. Needs no secrets and no database:
# the console creates its schema at runtime, not at build time. Vercel deploys separately.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # PageProps / LayoutProps are generated by Next; tsc needs them first.
      - name: Typecheck
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Build
        run: npm run build
